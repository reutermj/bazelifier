# Ubuntu deletes superseded package versions from archive.ubuntu.com, so a
# URL pinned by sha256 there eventually 404s. rules_rs 0.0.98 fetches the
# Rust toolchain's zlib that way (rs/private/rustc_repository.bzl), and the
# rustc repo then fails to fetch on any machine with a cold repository
# cache. snapshot.ubuntu.com keeps every version that was ever published at
# a stable timestamped path; the sha256 in rules_rs still pins the bytes, so
# the mirror cannot change what is built. Measured identical 2026-10-06.
# x86_64 only: the arm64 copy on ports.ubuntu.com 404s too, and snapshot
# has no ubuntu-ports archive to rewrite it to, so an arm64 host still needs
# a rules_rs upgrade.
rewrite archive.ubuntu.com/ubuntu/pool/(.*) snapshot.ubuntu.com/ubuntu/20260101T000000Z/pool/$1

# ftp.gnu.org timed out on every connection for a whole session (2026-10-06)
# while mirrors.kernel.org served byte-identical tarballs (libmicrohttpd's
# integrity matched). Both rewrites apply, in order, so the canonical host is
# tried first and the mirror only when it fails; the pinned hash covers both.
rewrite ftp.gnu.org/gnu/(.*) ftp.gnu.org/gnu/$1
rewrite ftp.gnu.org/gnu/(.*) mirrors.kernel.org/gnu/$1
